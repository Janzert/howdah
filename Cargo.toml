[workspace]
resolver = "3"
members = ["crates/howdah-arimaa", "crates/howdah-aei", "app/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
howdah-arimaa = { path = "crates/howdah-arimaa" }
howdah-aei = { path = "crates/howdah-aei" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
tokio = "1"

# The movegen cross-check test explores ~50k positions; unoptimized it's ~10x slower.
[profile.test]
opt-level = 1
