[workspace]
resolver = "3"
members = ["crates/arimaa-core"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
arimaa-core = { path = "crates/arimaa-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"

# The movegen cross-check test explores ~50k positions; unoptimized it's ~10x slower.
[profile.test]
opt-level = 1
