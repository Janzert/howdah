[package]
name = "howdah-aei"
version = "0.1.0"
description = "Async controller for Arimaa Engine Interface (AEI) engines"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
howdah-arimaa.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "macros", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
