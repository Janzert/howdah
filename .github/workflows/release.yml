name: Release

# A tag like v0.2.0 builds the installers on each platform and publishes
# them, with SHA256SUMS, as a draft GitHub release to look over and
# publish by hand.
#
# Versions are semver, 0.x until the app settles. The version lives in
# app/src-tauri/tauri.conf.json, app/src-tauri/Cargo.toml (and so
# Cargo.lock) and app/package.json (and its lock file); the tag must
# match all of them, or the run stops before building. To release, bump
# the version in those files, commit, push, then tag and push the tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Run by hand (workflow_dispatch), it builds the installers as artifacts
# without publishing anything.
#
# The builds aren't code signed (the macOS app is signed ad hoc, which
# Apple Silicon needs to run it at all), so each OS warns on first start;
# the release notes say how to get past that.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        id: check
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, re, tomllib

          found = {
              "tauri.conf.json": json.load(open("app/src-tauri/tauri.conf.json"))["version"],
              "Cargo.toml": tomllib.load(open("app/src-tauri/Cargo.toml", "rb"))["package"]["version"],
              "package.json": json.load(open("app/package.json"))["version"],
              "package-lock.json": json.load(open("app/package-lock.json"))["packages"][""]["version"],
              "Cargo.lock": next(
                  p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "howdah"
              ),
          }
          if os.environ["IS_TAG"] == "true":
              found["tag"] = os.environ["REF_NAME"].removeprefix("v")
          for k, v in found.items():
              print(f"{k}: {v}")
          versions = set(found.values())
          if len(versions) != 1:
              raise SystemExit("versions differ")
          version = versions.pop()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"not a plain semver version: {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          EOF

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Ubuntu, so the packages run on older glibc.
          - { os: ubuntu-22.04, platform: linux }
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Tauri build
        working-directory: app
        run: npm run tauri build -- --ci

      - name: Collect the installers
        run: |
          mkdir dist
          shopt -s nullglob
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage target/release/bundle/msi/*.msi \
            target/release/bundle/nsis/*.exe target/release/bundle/dmg/*.dmg dist/
          ls -l dist
          [ -n "$(ls dist)" ]

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/

      - name: Publish a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Howdah $VERSION.

          | System | Download |
          | --- | --- |
          | Windows (x64) | \`Howdah_${VERSION}_x64-setup.exe\` (installer) or \`Howdah_${VERSION}_x64_en-US.msi\` |
          | macOS (Apple Silicon) | \`Howdah_${VERSION}_aarch64.dmg\` |
          | Linux (x86_64) | \`.deb\` (Debian, Ubuntu), \`.rpm\` (Fedora, RHEL) or \`.AppImage\` (any; \`chmod +x\` it) |

          The builds aren't code signed, so the first start needs a step:

          - **Windows:** SmartScreen says it protected your PC; click
            *More info*, then *Run anyway*.
          - **macOS:** after macOS refuses to open it, go to System Settings,
            *Privacy & Security*, and click *Open Anyway* by Howdah's entry.
            If macOS says the app is damaged, run
            \`xattr -dr com.apple.quarantine /Applications/Howdah.app\`.

          \`SHA256SUMS\` lists each file's SHA-256 digest.
          EOF
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Howdah $VERSION" --notes-file notes.md
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
